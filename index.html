<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>富谷の洗濯日和</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="洗濯">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef3f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121a20" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=M+PLUS+1p:wght@400;500;700&display=swap">
<style>
/* 1カラム。今日の洗濯判定が画面の主役、明日は下に小さく。 */
:root{
  --bg:#eef3f6; --surface:#ffffff; --ink:#1d2a33; --muted:#5f707c; --line:#d6e0e6;
  --ok:#1f8a5b; --ok-bg:#e1f3ea; --mid:#b07a10; --mid-bg:#fbf0d6; --ng:#b8434a; --ng-bg:#f8e2e3; --sky:#3a7fb0;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --body:"M PLUS 1p","Hiragino Sans","Noto Sans JP",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121a20; --surface:#1b252d; --ink:#e7eef2; --muted:#93a4b0; --line:#2b3842;
  --ok:#5fd19a; --ok-bg:#163327; --mid:#e8b84d; --mid-bg:#352a12; --ng:#f08389; --ng-bg:#3a1d20; --sky:#7ab8e3; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h1{font-family:var(--display);font-weight:900;font-size:20px;margin:0}
.meta{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;text-align:right;background:none;border:0;padding:4px 0;font-family:inherit;cursor:pointer}
.hero{border-radius:22px;padding:22px 20px 18px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.hero[data-v="ok"]{background:var(--ok-bg)} .hero[data-v="mid"]{background:var(--mid-bg)} .hero[data-v="ng"]{background:var(--ng-bg)}
.eyebrow{font-size:13px;color:var(--muted);font-weight:500}
.verdict{display:flex;align-items:center;gap:16px}
.mark{font-family:var(--display);font-weight:900;font-size:96px;line-height:1;width:100px;text-align:center}
[data-v="ok"] .mark,[data-v="ok"] .vtext{color:var(--ok)}
[data-v="mid"] .mark,[data-v="mid"] .vtext{color:var(--mid)}
[data-v="ng"] .mark,[data-v="ng"] .vtext{color:var(--ng)}
.vtext{font-family:var(--display);font-weight:900;font-size:30px;line-height:1.2;text-wrap:balance}
.reason{font-size:14px;margin:0}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{background:var(--surface);border-radius:12px;padding:8px 12px;display:flex;justify-content:space-between;align-items:baseline;font-variant-numeric:tabular-nums}
.slot b{font-size:20px;font-family:var(--display)} .slot span{font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px}
.row .mark{font-size:44px;width:52px}
.card-v{font-family:var(--display);font-weight:700;font-size:18px}
.sub{font-size:13px;color:var(--muted);margin:0}
.weather{font-size:13px;color:var(--sky);font-weight:500}
details{font-size:12.5px;color:var(--muted)} summary{cursor:pointer;padding:4px 0}
details ul{margin:6px 0 0;padding-left:18px}
.empty{text-align:center;color:var(--muted);padding:40px 12px}
</style>
</head>
<body>
<main>
  <header>
    <h1>富谷の洗濯日和</h1>
    <button class="meta" id="meta" type="button" aria-label="再読み込み">読み込み中…</button>
  </header>
  <div id="app"><div class="empty">気象庁の予報を読み込んでいます…</div></div>
  <details>
    <summary>判定のしかた</summary>
    <ul>
      <li>対象は朝6時〜夕方18時。気象庁「宮城県東部」（富谷市を含む区域）の予報を、開くたびに直接読み込みます。</li>
      <li>○ 外干しOK：6〜12時・12〜18時の降水確率がどちらも10%以下で、予報文に「雨」「雪」がない。</li>
      <li>△ にわか雨に注意：降水確率20〜40%、または「にわか雨」「一時雨」「所により雨」などの文言がある。</li>
      <li>× 部屋干し：降水確率50%以上、または雨・雪が主な天気。</li>
      <li>18時を過ぎると明日の判定を表示します。右上の更新時刻をタップすると再読み込みします。</li>
    </ul>
  </details>
</main>
<script>
const SRC="https://www.jma.go.jp/bosai/forecast/data/forecast/040000.json";
const AREA="040010"; // 宮城県東部
const MARK={ok:"○",mid:"△",ng:"×"};

function jstNow(){return new Date(Date.now()+9*3600e3)}
function isoDate(d){return d.toISOString().slice(0,10)}

// 気象庁JSON → [{date, weather, weatherCode, pop06, pop12}]
function parse(json){
  const ts=json[0].timeSeries;
  const w=ts[0], wa=w.areas.find(a=>a.area.code===AREA)||w.areas[0];
  const days=w.timeDefines.map((t,i)=>({date:t.slice(0,10),weather:(wa.weathers?.[i]||"").replace(/　/g," "),weatherCode:wa.weatherCodes?.[i]||"",pop06:null,pop12:null}));
  const p=ts[1], pa=p.areas.find(a=>a.area.code===AREA)||p.areas[0];
  p.timeDefines.forEach((t,i)=>{
    const d=days.find(x=>x.date===t.slice(0,10)); if(!d) return;
    const h=t.slice(11,13), v=pa.pops[i]; if(v===""||v==null) return;
    if(h==="06") d.pop06=Number(v); if(h==="12") d.pop12=Number(v);
  });
  return {days,reportDatetime:json[0].reportDatetime};
}

function judge(d){
  const p=[d.pop06,d.pop12].filter(v=>typeof v==="number");
  const max=p.length?Math.max(...p):null;
  const c=String(d.weatherCode||"")[0];
  const text=d.weather||"";
  const rainWord=/雨|雪/.test(text);
  if(max===null) return {v:"mid",t:"判定できません",r:"日中の降水確率がまだ発表されていません。"};
  if(c==="3"||c==="4"||max>=50) return {v:"ng",t:"部屋干しの日",r:`日中の降水確率が最大${max}%。雨が降る見込みです。`};
  if(max<=10&&!rainWord) return {v:"ok",t:"外干しできます",r:`6時〜18時の降水確率は最大${max}%。1日中雨の心配はなさそうです。`};
  const hit=(text.match(/[^ ]*(雨|雪)[^ ]*/)||[])[0];
  return {v:"mid",t:"にわか雨に注意",r:rainWord?`予報に「${hit}」の文言あり（降水確率 最大${max}%）。干すなら目の届く範囲で。`:`降水確率が最大${max}%。少し雨のリスクがあります。`};
}
function dayLabel(iso){const [y,m,d]=iso.split("-").map(Number);return `${m}月${d}日（${"日月火水木金土"[new Date(Date.UTC(y,m-1,d)).getUTCDay()]}）`}
function slot(l,v){return `<div class="slot"><span>${l}</span><b>${typeof v==="number"?v+"%":"–"}</b></div>`}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function render({days,reportDatetime}){
  const now=jstNow(), today=isoDate(now);
  let i=days.findIndex(d=>d.date===today); if(i<0) i=0;
  const t=days[i];
  if(days[i+1] && (now.getUTCHours()>=18 || (t.date===today && t.pop06==null && t.pop12==null))) i++;
  const main=days[i], next=days[i+1], j=judge(main);
  const label=main.date===today?"今日":main.date===isoDate(new Date(now.getTime()+864e5))?"明日":"";
  let h=`<section class="hero" data-v="${j.v}">
    <div class="eyebrow">${label} ${dayLabel(main.date)}・6時〜18時の洗濯</div>
    <div class="verdict"><div class="mark" aria-hidden="true">${MARK[j.v]}</div><div class="vtext">${j.t}</div></div>
    <p class="reason">${esc(j.r)}</p>
    <div class="slots">${slot("6〜12時 降水",main.pop06)}${slot("12〜18時 降水",main.pop12)}</div>
    <div class="weather">気象庁：${esc(main.weather)}</div></section>`;
  if(next&&(next.pop06!=null||next.pop12!=null)){const k=judge(next);
    h+=`<section class="card"><div class="eyebrow">${dayLabel(next.date)}</div>
      <div class="row" data-v="${k.v}"><div class="mark" aria-hidden="true">${MARK[k.v]}</div>
      <div><div class="card-v">${k.t}</div><p class="sub">降水 6〜12時 ${next.pop06??"–"}% ／ 12〜18時 ${next.pop12??"–"}%</p></div></div>
      <div class="weather">気象庁：${esc(next.weather)}</div></section>`;}
  document.getElementById("app").innerHTML=h;
  const r=new Date(reportDatetime);
  document.getElementById("meta").textContent=`${r.getMonth()+1}/${r.getDate()} ${String(r.getHours()).padStart(2,"0")}時発表 ↻`;
}

async function load(){
  const meta=document.getElementById("meta");
  meta.textContent="更新中…";
  try{
    const res=await fetch(SRC,{cache:"no-store"});
    if(!res.ok) throw new Error(res.status);
    const json=await res.json();
    try{localStorage.setItem("jma",JSON.stringify(json))}catch(e){}
    render(parse(json));
  }catch(e){
    let cached=null; try{cached=JSON.parse(localStorage.getItem("jma"))}catch(_){}
    if(cached){render(parse(cached));meta.textContent+="（オフライン）"}
    else{document.getElementById("app").innerHTML=`<div class="empty">予報を読み込めませんでした。<br>電波の良い場所で右上をタップして再読み込みしてください。</div>`;meta.textContent="再読み込み ↻"}
  }
}
document.getElementById("meta").addEventListener("click",load);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")load()});
load();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
